# AUSTRALIA-ONLY EDITION (v5). THIS IS THE FILE THAT RUNS THE AUTOMATION. GitHub starts it twice a day by itself,
# or when you click Actions > "Run AU Lead Bot" > Run workflow.
#
# layout:  setup (tests + tabs + Stats)  ->  collect (one job per state group / source, ONE AT A TIME: they all write
#          the same sheet, and v5 appends below the last row, so two writers at once could overwrite each other)
#          ->  finish (Stats tab, values in place; rows are never sorted or rewritten)
# Sheet: SHEET_ID_AU_ONLY (or the old SHEET_ID). Secrets: ONE secret per key, see SECRETS_GUIDE.md.
# 6 jobs x up to ~45 min x 2 runs/day: needs a PUBLIC repo (unlimited minutes; this repo holds no secrets).
# PRIVATE repo (2,000 free min/month): set the variable LEAD_MATRIX to
#   {"include":[{"name":"all","regions":"","sources":""}]}   and delete the second cron line.
name: Run AU Lead Bot
on:
  schedule:
    - cron: "0 19 * * *"      # 19:00 UTC = 6am Sydney (summer) / 5am (winter)
    - cron: "0 7 * * *"       # 07:00 UTC = 6pm Sydney (second daily run: public repo only)
  workflow_dispatch:           # the manual "Run workflow" button
concurrency:                   # a second run waits for the first: never two writers on the sheet
  group: au-lead-bot
  cancel-in-progress: false
permissions:
  contents: read
env:
  # ===== REQUIRED =====
  GOOGLE_SA: ${{ secrets.GOOGLE_SA }}
  SHEET_ID_AU_ONLY: ${{ secrets.SHEET_ID_AU_ONLY }}
  SHEET_ID: ${{ secrets.SHEET_ID }}
  # ===== OPTIONAL: one secret per key. Unset = that module switches itself off, no errors =====
  GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
  GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
  GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
  GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
  YOUTUBE_API_KEY_1: ${{ secrets.YOUTUBE_API_KEY_1 }}
  YOUTUBE_API_KEY_2: ${{ secrets.YOUTUBE_API_KEY_2 }}
  HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
  ZEROBOUNCE_API_KEY: ${{ secrets.ZEROBOUNCE_API_KEY }}
  SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
  BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
  ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
  JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
  ABN_GUID: ${{ secrets.ABN_GUID }}
  APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
  APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
  IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
  IG_USER_ID: ${{ vars.IG_USER_ID }}
  NZBN_API_KEY: ${{ secrets.NZBN_API_KEY }}
  SNOV_CLIENT_ID: ${{ secrets.SNOV_CLIENT_ID }}
  SNOV_CLIENT_SECRET: ${{ secrets.SNOV_CLIENT_SECRET }}
  PROSPEO_API_KEY: ${{ secrets.PROSPEO_API_KEY }}
  REACHER_URL: ${{ secrets.REACHER_URL }}
  REACHER_SECRET: ${{ secrets.REACHER_SECRET }}
  # old combined secrets: still read as a fallback (prefer the single ones above)
  AI_API_KEYS: ${{ secrets.AI_API_KEYS }}
  YOUTUBE_API_KEYS: ${{ secrets.YOUTUBE_API_KEYS }}
  PLACES_API_KEYS: ${{ secrets.PLACES_API_KEYS }}
  ABN_LOOKUP_GUID: ${{ secrets.ABN_LOOKUP_GUID }}
  # ===== variables =====
  USE_JINA: ${{ vars.USE_JINA }}
  KEY_CHECK: ${{ vars.KEY_CHECK }}       # 'warn' = keep a key whose format looks unusual (default: ignore it)
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Self-test + unit tests (offline, a few seconds; stops here with a clear message if the code is broken)
        run: |
          python src/selftest.py
          python -m unittest discover -s tests
      - name: Create / update the control tabs + Stats once
        run: python src/leadbot.py --setup

  collect:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60          # the bot itself stops cleanly after Rules > MAX_RUNTIME_MIN (42)
    strategy:
      fail-fast: false
      max-parallel: 1            # ONE writer at a time on the single sheet (append-only, no overwrites)
      # regions = Locations state codes for map searches; sources = input, imports, maps, youtube
      matrix: ${{ fromJSON(vars.LEAD_MATRIX || '{"include":[{"name":"nsw-act","regions":"AU-NSW,AU-ACT","sources":"input,maps"},{"name":"vic-tas","regions":"AU-VIC,AU-TAS","sources":"maps"},{"name":"qld","regions":"AU-QLD","sources":"maps"},{"name":"wa-sa-nt","regions":"AU-WA,AU-SA,AU-NT","sources":"maps"},{"name":"youtube","regions":"","sources":"youtube"},{"name":"imports","regions":"","sources":"imports"}]}') }}
    name: collect (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the bot (${{ matrix.name }})
        run: python src/leadbot.py --no-finish
        env:
          REGIONS: ${{ matrix.regions }}
          SOURCES: ${{ matrix.sources }}

  finish:
    needs: [setup, collect]
    if: ${{ always() && needs.setup.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Stats tab (values in place). Rows are never sorted or rewritten.
        run: python src/leadbot.py --finish
